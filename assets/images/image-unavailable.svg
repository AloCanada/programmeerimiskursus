<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240" role="img" aria-labelledby="title description">
  <title id="title">Pilt ei ole saadaval</title>
  <desc id="description">Algne välisallika pilt ei olnud ehituse ajal kättesaadav.</desc>
  <rect width="800" height="240" fill="#e6f7ff"/>
  <rect x="20" y="20" width="760" height="200" fill="none" stroke="#3d9ac2" stroke-width="4"/>
  <text x="400" y="112" text-anchor="middle" fill="#303030" font-family="Verdana, sans-serif" font-size="24">Pilt ei ole praegu saadaval</text>
  <text x="400" y="150" text-anchor="middle" fill="#65717a" font-family="Verdana, sans-serif" font-size="15">Lisa algne pilt kausta assets/images.</text>
</svg>
